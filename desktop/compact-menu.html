<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:8px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:#f8faf6;color:#213e32}button{display:block;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#e2ebe0;outline:none}button:disabled{opacity:.4;cursor:default}hr{border:0;border-top:1px solid #dbe3d7;margin:5px 4px}.mark{display:inline-block;width:18px}#items{max-height:calc(100vh - 16px);overflow:auto}@media(prefers-color-scheme:dark){body{background:#222e27;color:#e6eade}button:hover,button:focus-visible{background:#37443a}hr{border-color:#495748}}
</style></head><body><div id="items" role="menu" aria-label="Timer options"></div><script>
window.renderMenu=items=>{const root=document.getElementById('items');root.replaceChildren();for(const item of items){if(item.separator){root.append(document.createElement('hr'));continue}const b=document.createElement('button');b.setAttribute('role',item.checked===undefined?'menuitem':'menuitemcheckbox');if(item.checked!==undefined)b.setAttribute('aria-checked',String(item.checked));b.disabled=item.enabled===false;const mark=document.createElement('span');mark.className='mark';mark.textContent=item.checked?'✓':'';b.append(mark,document.createTextNode(item.label));b.onclick=()=>window.menuAPI.choose(item.id);root.append(b)}root.querySelector('button:not(:disabled)')?.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){window.menuAPI.choose('');return}if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const buttons=[...document.querySelectorAll('button:not(:disabled)')],i=buttons.indexOf(document.activeElement);const n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[n]?.focus()}});
</script></body></html>
